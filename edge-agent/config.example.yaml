heimdall:
  api_url: "https://backendtesis-production-d03f.up.railway.app"
  iot_key: "REEMPLAZAR_CON_IOT_INGEST_API_KEY"
  source_name: "PLC_LINEA_01"

# Opciones: simulation | modbus | opcua
protocol: "simulation"
poll_interval_seconds: 5
buffer_db_path: "/data/edge_buffer.db"

modbus:
  host: "192.168.10.50"
  port: 502
  assets:
    - tag_number: "P-101"
      registers:
        vibration_mm_s: { address: 40001, scale: 0.01, unit_id: 1 }
        temperature_celsius: { address: 40002, scale: 0.1, unit_id: 1 }
        pressure_psi: { address: 40003, scale: 1.0, unit_id: 1 }

opcua:
  endpoint: "opc.tcp://192.168.10.60:4840"
  assets:
    - tag_number: "C-201"
      nodes:
        vibration_mm_s: "ns=2;s=Compresor201.Vibracion"
        temperature_celsius: "ns=2;s=Compresor201.Temperatura"
        pressure_psi: "ns=2;s=Compresor201.Presion"

simulation:
  assets:
    - tag_number: "P-101"
    - tag_number: "C-201"
    - tag_number: "S-301"
